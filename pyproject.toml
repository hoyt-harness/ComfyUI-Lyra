[project]
name = "comfyui-lyra"
version = "0.1.0"
description = "Orpheus TTS 3B text-to-speech custom node for ComfyUI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hoyt Harness", email = "hoyt.harness@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pedalboard",
]

[project.optional-dependencies]
runtime = [
    "torch",
    "soundfile",
    "transformers",
    "huggingface_hub",
    "nltk>=3.10.3",
    "snac",
    "librosa>=0.10.2",
]

[project.urls]
Repository = "https://github.com/hoyt-harness/ComfyUI-Lyra"
Issues = "https://github.com/hoyt-harness/ComfyUI-Lyra/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "example_workflows/",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.400",
    "safety>=3.0.0",
    "bandit>=1.7.8",
    "pip-licenses>=4.4.0",
    "pytest>=8.0.0",
    "cyclonedx-bom>=4.0.0",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
reportUntypedFunctionDecorator = false
reportUntypedClassDecorator = false
reportUntypedBaseClass = false
reportPrivateUsage = false
reportPrivateImportUsage = false
exclude = [
    "**/__pycache__",
    ".venv",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "PERF", "S"]
ignore = ["PERF203", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"hf_auth.py" = ["E501"]
"__init__.py" = ["E402", "E501", "F401", "S110"]
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
